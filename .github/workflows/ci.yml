name: Verify offline tracker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tracker.py --answers examples/answers.csv --citations examples/citations.csv --as-of 2026-11-01 --output examples/report
      - run: python tracker.py --answers examples/window-two-answers.csv --citations examples/window-two-citations.csv --as-of 2026-11-01 --output examples/window-two-report
      - run: git diff --exit-code -- examples/report examples/window-two-report
